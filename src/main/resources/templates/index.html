<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Телеграм-Аутентификация</title>
    <link rel="stylesheet" href="/css/tailwind.css">
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
<div class="bg-white p-8 rounded-2xl shadow-lg max-w-md w-full">
    <h1 class="text-2xl font-bold mb-4">Добро пожаловать!</h1>
    <ul class="space-y-2">
        <li><strong>ID:</strong> <span th:text="${user.id}"/></li>
        <li><strong>Имя:</strong> <span th:text="${user.firstName}"/></li>
        <li><strong>Фамилия:</strong> <span th:text="${user.lastName}"/></li>
        <li><strong>Username:</strong> <span th:text="${user.username}"/></li>
        <li><strong>AuthDate:</strong> <span th:text="${user.authDate}"/></li>
    </ul>
</div>
</body>
</html>
