<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Telegram WebApp</title>
    <link rel="stylesheet" href="/css/tailwind.css">
    <script async src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 flex items-center justify-center min-h-screen p-4">
<div
        id="content"
        class="bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-xl max-w-md w-full transform transition-all duration-500 scale-95 opacity-0 text-white dark:text-gray-200">
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.ready();

    const content = document.getElementById('content');
    const initData = tg.initData;

    const fadeIn = () => {
        content.classList.remove('scale-95', 'opacity-0');
        content.classList.add('scale-100', 'opacity-100');
    };

    const loading = () => {
        content.innerHTML = `
        <p class="text-white dark:text-gray-300">Загрузка данных...</p>
      `;
        fadeIn();
    };

    const renderError = (message) => {
        content.innerHTML = `
        <h1 class="text-xl font-semibold text-red-600 dark:text-red-400 mb-2">Ошибка</h1>
        <p class="text-white dark:text-gray-200">${message}</p>
      `;
        fadeIn();
    };

    const renderUser = (user) => {
        const items = [];
        items.push(`<li><span class="font-medium">ID:</span> ${user.id}</li>`);
        if (user.firstName) {
            items.push(`<li><span class="font-medium">Имя:</span> ${user.firstName}</li>`);
        }
        if (user.lastName) {
            items.push(`<li><span class="font-medium">Фамилия:</span> ${user.lastName}</li>`);
        }
        if (user.username) {
            items.push(`<li><span class="font-medium">Username:</span> @${user.username}</li>`);
        }

        content.innerHTML = `
        <div class="flex flex-col items-center">
          ${user.photoUrl ? `<img src="${user.photoUrl}" alt="avatar" class="h-24 w-24 rounded-full mb-4 border-2 border-gray-200 dark:border-gray-700"/>` : ''}
          <h1 class="text-2xl font-bold mb-2 text-white dark:text-gray-100">Добро пожаловать${user.firstName ? `, ${user.firstName}` : ''}${user.lastName ? ` ${user.lastName}` : ''}</h1>
          <ul class="text-left w-full space-y-2 text-gray-800 dark:text-gray-200">
            ${items.join('')}
          </ul>
        </div>`;
        fadeIn();
    };

    if (!initData) {
        renderError('Пожалуйста, откройте WebApp из мобильного Telegram.');
    } else {
        loading();
        fetch(`/api/auth`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({initData})
        })
            .then(res => res.json().then(json => ({status: res.status, json})))
            .then(({status, json}) => {
                if (status !== 200) throw new Error(json.error || 'Auth failed');
                renderUser({
                    id: json.id,
                    firstName: json.firstName,
                    lastName: json.lastName,
                    username: json.username,
                    photoUrl: json.photoUrl
                });
            })
            .catch(err => renderError(err.message));
    }
</script>
</body>
</html>
